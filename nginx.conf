server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  error_page 404 /404.html;
  # detrás del proxy: las redirecciones (/dorsal/7 -> /dorsal/7/) no deben llevar host ni puerto internos
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain model/gltf-binary;

  add_header X-Content-Type-Options nosniff always;

  # archivos con hash en el nombre: no cambian nunca
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }

  # modelos 3D: la geometría se comprime a la mitad
  location ~* \.glb$ {
    types { model/gltf-binary glb; }
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    add_header X-Content-Type-Options nosniff always;
  }

  # texturas, retratos, escudo e imágenes de compartir (sin hash: un día, y se revalidan en segundo plano)
  location ~* ^/(kit|jugadores|escudo|og)/ {
    add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    add_header X-Content-Type-Options nosniff always;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }
}
